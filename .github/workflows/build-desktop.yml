name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows
            artifact_path: |
              release/*-setup.exe
              release/*-setup.exe.blockmap
              release/latest.yml
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos-universal
            artifact_path: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Configure online server
        env:
          NAMU_RACE_SERVER_URL: ${{ vars.NAMU_RACE_SERVER_URL }}
        run: node -e "require('node:fs').writeFileSync('server-url.txt', process.env.NAMU_RACE_SERVER_URL || 'https://namu-race-online.namu-race-online.workers.dev')"
      - run: ${{ matrix.command }}
      - name: Verify Windows update download and checksum rejection
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: npx electron test/integration-updater.cjs
      - name: Verify custom installation, relocation and update path
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        run: ./test/installer-paths.ps1
      - name: Verify macOS package and online play
        if: runner.os == 'macOS'
        shell: bash
        env:
          NAMU_RACE_TEST_URL: ${{ vars.NAMU_RACE_SERVER_URL }}
        run: |
          set -euo pipefail
          DMG_PATH="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          MOUNT_PATH="$RUNNER_TEMP/namu-race-mount"
          mkdir -p "$MOUNT_PATH"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_PATH"
          cleanup() {
            hdiutil detach "$MOUNT_PATH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          APP_PATH="$(find "$MOUNT_PATH" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          EXECUTABLE_PATH="$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME"
          lipo "$EXECUTABLE_PATH" -verify_arch x86_64 arm64
          ELECTRON_VERSION="$(ELECTRON_RUN_AS_NODE=1 "$EXECUTABLE_PATH" -e "process.stdout.write(process.versions.electron)")"
          test "$ELECTRON_VERSION" = '43.5.1'
          npx asar list "$APP_PATH/Contents/Resources/app.asar" >"$RUNNER_TEMP/namu-race-asar.txt"
          grep -q 'server-url.txt' "$RUNNER_TEMP/namu-race-asar.txt"
          node test/integration-modes.mjs
          node test/integration-online.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: namu-race-${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: namu-race-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish installers and update metadata together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-artifacts/latest.yml
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "나무레이스 온라인 $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
