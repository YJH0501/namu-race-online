name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows
            artifact_path: release/*.exe
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos-universal
            artifact_path: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure online server
        env:
          NAMU_RACE_SERVER_URL: ${{ vars.NAMU_RACE_SERVER_URL }}
        run: node -e "require('node:fs').writeFileSync('server-url.txt', process.env.NAMU_RACE_SERVER_URL || 'http://127.0.0.1:8787')"
      - run: ${{ matrix.command }}
      - name: Verify and run macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          MOUNT_PATH="$RUNNER_TEMP/namu-race-mount"
          mkdir -p "$MOUNT_PATH"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_PATH"
          APP_PID=''
          cleanup() {
            if [ -n "$APP_PID" ]; then kill "$APP_PID" 2>/dev/null || true; fi
            hdiutil detach "$MOUNT_PATH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          APP_PATH="$(find "$MOUNT_PATH" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          EXECUTABLE_PATH="$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME"
          lipo "$EXECUTABLE_PATH" -verify_arch x86_64 arm64
          npx asar list "$APP_PATH/Contents/Resources/app.asar" >"$RUNNER_TEMP/namu-race-asar.txt"
          grep -q 'server-url.txt' "$RUNNER_TEMP/namu-race-asar.txt"
          ELECTRON_ENABLE_LOGGING=1 "$EXECUTABLE_PATH" --remote-debugging-port=9225 --user-data-dir="$RUNNER_TEMP/namu-race-profile" >"$RUNNER_TEMP/namu-race-app.log" 2>&1 &
          APP_PID=$!
          READY='false'
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9225/json/list >/dev/null; then READY='true'; break; fi
            sleep 1
          done
          if [ "$READY" != 'true' ]; then
            cat "$RUNNER_TEMP/namu-race-app.log"
            exit 1
          fi
          NAMU_RACE_DEBUG_ORIGIN=http://127.0.0.1:9225 node test/e2e-electron.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: namu-race-${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
